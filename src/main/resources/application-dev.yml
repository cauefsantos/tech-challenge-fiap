spring:

# Comentar este trecho de código caso precise de execução local
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

## Descomentar caso esteja utilizando base de dados local para testes
  # datasource:
  #   url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina}
  #   username: ${DB_USERNAME:postgres}
  #   password: ${DB_PASSWORD:postgres}
  #   driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: false
    validate-on-migrate: true
logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
app:
  security:
    jwt-secret: ${JWT_SECRET:SGVsbG9Xb3JsZDEyMzQ1Njc4OTBBQkNERUY}
    token-validity: ${JWT_TOKEN_VALIDITY:PT2H}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}