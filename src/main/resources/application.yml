spring:
  application:
    name: oficina-api
  profiles:
    default: dev
server:
  port: ${SERVER_PORT:8080}
app:
  security:
    jwt-secret: ${JWT_SECRET}
    token-validity: ${JWT_TOKEN_VALIDITY:PT2H}
  admin:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
