spring:
  application:
    name: oficina-api
  profiles:
    default: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: false
server:
  port: 8080
app:
  security:
    jwt-secret: ${JWT_SECRET:ZXN0YS1lLXVtYS1jaGF2ZS1kZS1kZXNlbnZvbHZpbWVudG8tMzItYnl0ZXM=}
    token-validity: ${JWT_TOKEN_VALIDITY:PT2H}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
