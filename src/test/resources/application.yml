spring:
  application:
    name: oficina-api
  profiles:
    default: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
server:
  port: 8080
app:
  security:
    jwt-secret: VGVzdEtleUZvclRoaXNBcHBsaWNhdGlvbjMyQnl0ZXM=
    token-validity: PT2H
  admin:
    username: test-bootstrap-admin
    password: test-only-password-1234
springdoc:
  swagger-ui:
    path: /swagger-ui.html
