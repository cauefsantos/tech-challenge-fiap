components:
  schemas:
    VeiculoRequest:
      type: object
      properties:
        documentoCliente:
          type: string
          minLength: 1
        placa:
          type: string
          minLength: 1
        marca:
          type: string
          minLength: 1
        modelo:
          type: string
          minLength: 1
        ano:
          type: integer
          format: int32
      required:
      - ano
      - documentoCliente
      - marca
      - modelo
      - placa
    VeiculoResponse:
      type: object
      properties:
        placa:
          type: string
        documentoCliente:
          type: string
        marca:
          type: string
        modelo:
          type: string
        ano:
          type: integer
          format: int32
        dataCadastro:
          type: string
          format: date-time
        ativo:
          type: boolean
    AtualizarUsuarioRequest:
      type: object
      properties:
        papel:
          type: string
          enum:
          - ADMIN
          - FUNCIONARIO
          - CLIENTE
        documentoCliente:
          type: string
        enabled:
          type: boolean
      required:
      - enabled
      - papel
    UsuarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        papel:
          type: string
          enum:
          - ADMIN
          - FUNCIONARIO
          - CLIENTE
        enabled:
          type: boolean
        documentoCliente:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ServicoRequest:
      type: object
      properties:
        codigo:
          type: string
          minLength: 1
        nome:
          type: string
          minLength: 1
        descricao:
          type: string
        valorBase:
          type: number
        tempoEstimadoSegundos:
          type: integer
          format: int64
      required:
      - codigo
      - nome
      - tempoEstimadoSegundos
      - valorBase
    ServicoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
        nome:
          type: string
        descricao:
          type: string
        valorBase:
          type: number
        tempoEstimadoSegundos:
          type: integer
          format: int64
        dataCadastro:
          type: string
          format: date-time
        ativo:
          type: boolean
    MaterialAtualizacaoRequest:
      type: object
      properties:
        codigo:
          type: string
          minLength: 1
        tipo:
          type: string
          enum:
