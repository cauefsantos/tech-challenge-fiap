name: Build and release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Create a GitHub release, tag and advance the POM to the next SNAPSHOT
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest

    steps:
      - name: Require main for releases
        if: ${{ inputs.release }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases can only be created from main."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Read and validate project version
        id: version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import xml.etree.ElementTree as ET

          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          root = ET.parse("pom.xml").getroot()
          version = root.findtext("m:version", namespaces=namespace)
          if not version:
              raise SystemExit("Could not read the project version from pom.xml")

          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)(-SNAPSHOT)?", version)
          if not match:
              raise SystemExit(
                  f"Unsupported version '{version}'. Expected MAJOR.MINOR.PATCH[-SNAPSHOT]."
              )

          major, minor, patch, suffix = match.groups()
          release_version = f"{major}.{minor}.{patch}"
          next_version = f"{major}.{minor}.{int(patch) + 1}-SNAPSHOT"
          print(f"current={version}")
          print(f"release={release_version}")
          print(f"next={next_version}")
          PY

      - name: Set release version
        if: ${{ inputs.release }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        run: mvn -B versions:set "-DnewVersion=$RELEASE_VERSION" -DgenerateBackupPoms=false

      - name: Run Maven verification
        run: mvn -B clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tech-challenge-fiap-${{ inputs.release && steps.version.outputs.release || steps.version.outputs.current }}
          path: target/tech-challenge-fiap-*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Commit release version and create tag
        if: ${{ inputs.release }}
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $RELEASE_VERSION"
            git push origin HEAD:main
          fi

          if ! git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" >/dev/null; then
            git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
            git push origin "$RELEASE_VERSION"
          fi

      - name: Publish GitHub release
        if: ${{ inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.release }}
        run: |
          jar="target/tech-challenge-fiap-$RELEASE_VERSION.jar"
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" "$jar" --clobber
          else
            gh release create "$RELEASE_VERSION" "$jar" \
              --title "$RELEASE_VERSION" \
              --notes "Release $RELEASE_VERSION of tech-challenge-fiap."
          fi

      - name: Advance POM to next SNAPSHOT
        if: ${{ inputs.release }}
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          mvn -B versions:set "-DnewVersion=$NEXT_VERSION" -DgenerateBackupPoms=false
          git add pom.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: start $NEXT_VERSION development"
            git push origin HEAD:main
          fi
